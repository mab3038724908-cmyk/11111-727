# 由机械/电控实测后填写。null 表示未知，规划器必须 fail closed，不能猜测。
schema_version: td25a.cleaner_hardware.v1

mechanism:
  # lateral_slide | telescopic | swing_arm | multi_dof
  type: null
  degrees_of_freedom: null
  zero_definition: null
  positive_direction: null

joints:
  # 示例字段；按真实机构改为一个或多个关节。
  - name: cleaner_joint
    unit: null
    minimum: null
    maximum: null
    maximum_speed_per_s: null
    maximum_acceleration_per_s2: null
    maximum_deceleration_per_s2: null
